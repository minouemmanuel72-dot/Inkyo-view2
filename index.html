<style>
/* Layout: a dark reading desk. App bar on top, the book on a lit stage, pager under it, then options and the page tray. Immersive mode lets the stage take the whole screen. */
:root {
  color-scheme: dark;
  --bg: #0A0A0F;
  --bg2: #14141d;
  --stage: #06060a;
  --ink: #f4f1ea;
  --muted: #8d8fa3;
  --line: #262633;
  --red: #FE2C55;
  --red-deep: #b3002e;
  --gold: #F2C879;
  --paper: #f4f2ec;
  --edge1: #dcdad2;
  --edge2: #a7a49a;
  --shadow: rgba(0, 0, 0, 0.85);
  --f-brand: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body: 'Zen Kaku Gothic New', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --dur: 900ms;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* App bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark {
  font-family: var(--f-brand); font-weight: 800; font-size: 24px; line-height: 0.8; letter-spacing: -0.03em;
  display: flex; flex-direction: column;
  background: linear-gradient(135deg, #ff7a93 0%, var(--red) 45%, var(--red-deep) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.32em; color: var(--gold); text-transform: uppercase; padding-left: 12px; border-left: 1px solid var(--line); line-height: 1.2; }
.actions { display: flex; gap: 8px; align-items: center; }

.btn {
  font: 500 14px/1 var(--f-body);
  min-height: 44px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg2); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn svg { flex: none; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.primary { background: linear-gradient(135deg, #ff4d70, var(--red) 55%, var(--red-deep)); border-color: transparent; color: #fff; font-weight: 700; box-shadow: 0 6px 22px -8px rgba(254, 44, 85, 0.8); }
.btn.icon { width: 44px; padding: 0; }
.btn[aria-pressed="true"]:not(.icon):not(.tgl) { background: var(--gold); border-color: var(--gold); color: #1a1405; font-weight: 700; }
.btn.tgl[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); }
.btn:focus-visible, input[type="range"]:focus-visible, .thumb button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.pick { position: relative; display: inline-block; }
.pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.pick:focus-within .btn { outline: 2px solid var(--gold); outline-offset: 2px; }
.snd .off { display: none; }
.snd[aria-pressed="false"] .on { display: none; }
.snd[aria-pressed="false"] .off { display: inline; }

.note { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--bg2); border: 1px dashed var(--line); color: var(--muted); font-size: 14px; }
.note.msg { border-style: solid; border-color: var(--gold); color: var(--ink); }

/* Stage */
.stage {
  position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
  background:
    radial-gradient(ellipse 70% 60% at 50% 38%, rgba(254, 44, 85, 0.10), rgba(254, 44, 85, 0) 70%),
    radial-gradient(ellipse at 50% 30%, #1d1d2a 0%, #0b0b11 62%, #050508 100%);
  touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: pointer;
}
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 2px, transparent 2px 7px); }
.stage.zoomed { overflow: auto; touch-action: auto; cursor: default; }
body.dragging .stage { outline: 2px dashed var(--gold); outline-offset: -6px; }
.bookwrap { display: flex; justify-content: center; width: max-content; min-width: 100%; padding-inline: 16px; margin: auto; position: relative; z-index: 1; }
.book {
  position: relative; flex: none; width: calc(var(--pw) * 2); height: var(--ph);
  perspective: calc(var(--pw) * 6);
  transform: translateX(calc(var(--pw) * var(--shift, 0) * 0.5));
  transition: transform var(--dur) cubic-bezier(.45, .05, .2, 1);
}
.book.noanim, .book.noanim * { transition: none !important; animation: none !important; }
.base { position: absolute; top: 0; width: var(--pw); height: var(--ph); background: var(--paper); }
.ltr .base.un { left: var(--pw); } .ltr .base.fl { left: 0; }
.rtl .base.un { left: 0; } .rtl .base.fl { left: var(--pw); }
.leaf { position: absolute; top: 0; width: var(--pw); height: var(--ph); transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transition: transform var(--dur) cubic-bezier(.5, .08, .2, 1); }
.ltr .leaf { left: var(--pw); transform-origin: left center; }
.ltr .leaf.flipped { transform: rotateY(-180deg); }
.rtl .leaf { left: 0; transform-origin: right center; }
.rtl .leaf.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; overflow: hidden; background: var(--paper); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face.back { transform: rotateY(180deg); }
.face img { display: block; width: 100%; height: 100%; max-width: none; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
.face i { position: absolute; inset: 0; pointer-events: none; }
.ltr .front .spine, .rtl .back .spine { background: linear-gradient(to right, rgba(0,0,0,.34), rgba(0,0,0,.08) 5%, rgba(0,0,0,0) 14%); }
.ltr .back .spine, .rtl .front .spine { background: linear-gradient(to left, rgba(0,0,0,.34), rgba(0,0,0,.08) 5%, rgba(0,0,0,0) 14%); }
.fshade { background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,0) 80%); opacity: 0; }
.leaf.flipping .fshade { animation: shade var(--dur) ease-in-out; }
@keyframes shade { 0% { opacity: 0; } 50% { opacity: .9; } 100% { opacity: 0; } }

/* Pager */
.pager { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.pager .mid { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pager input[type="range"] { width: 100%; accent-color: var(--gold); margin: 0; min-height: 28px; }
.pager .arrow { width: 52px; height: 52px; border-radius: 50%; font-size: 28px; line-height: 1; padding: 0 0 3px; color: var(--gold); border-color: #3a3322; }
.where { font-family: var(--f-mono); font-size: 13px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }

/* Options */
.opts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
.group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.group > span { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; margin-left: -1px; }
.seg .btn:first-child { border-radius: 12px 0 0 12px; margin-left: 0; }
.seg .btn:last-child { border-radius: 0 12px 12px 0; }
.zoomval { font-family: var(--f-mono); font-size: 13px; min-width: 4ch; text-align: center; font-variant-numeric: tabular-nums; }

/* Tray */
.tray h2 { font-family: var(--f-brand); font-size: 17px; font-weight: 700; margin: 6px 0 10px; letter-spacing: -0.01em; }
.thumbs { list-style: none; margin: 0; padding: 0 0 6px; display: flex; gap: 10px; overflow-x: auto; }
.thumb { flex: none; width: 92px; display: flex; flex-direction: column; gap: 6px; }
.thumb .pic { position: relative; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); aspect-ratio: 5 / 7; overflow: hidden; cursor: pointer; padding: 0; width: 100%; }
.thumb.on .pic { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.thumb .pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumb .num { position: absolute; left: 4px; top: 4px; background: var(--gold); color: #1a1405; font: 500 11px/1 var(--f-mono); padding: 3px 5px; border-radius: 3px; }
.thumb .acts { display: flex; gap: 4px; }
.thumb .acts button { flex: 1; min-height: 32px; font: 500 14px/1 var(--f-body); border: 1px solid var(--line); background: var(--bg2); color: var(--ink); border-radius: 8px; cursor: pointer; }
.thumb .acts button:disabled { opacity: .3; cursor: default; }
.tray.sample .acts { display: none; }
.foot { font-size: 12px; color: var(--muted); text-align: center; padding-top: 6px; }
.foot b { font-family: var(--f-brand); color: var(--gold); font-weight: 600; }

/* Immersive reading */
.exit { display: none; }
body.immersive { overflow: hidden; }
body.immersive .top, body.immersive .opts, body.immersive .tray, body.immersive .note, body.immersive .foot { display: none; }
body.immersive .stage { position: fixed; inset: 0; z-index: 5; border-radius: 0; border: 0; display: flex; }
body.immersive .pager {
  position: fixed; z-index: 6; background: rgba(10, 10, 15, 0.78); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid var(--line); border-radius: 18px; padding: 8px 12px;
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  max-width: 640px; margin-inline: auto;
}
body.immersive .exit { display: inline-flex; position: fixed; z-index: 7; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); background: rgba(10, 10, 15, 0.78); }

@media (max-width: 520px) {
  .mark { font-size: 21px; }
  .tag { display: none; }
  .btn.primary .lbl-long { display: none; }
}
@media (prefers-reduced-motion: reduce) { :root { --dur: 1ms; } }
</style>

<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" role="img" aria-label="Inkyo"><span>Ink</span><span>yo</span></div>
      <div class="tag">View</div>
    </div>
    <div class="actions">
      <button class="btn" id="installBtn" type="button" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
        Installer
      </button>
      <button class="btn icon snd" id="sndBtn" type="button" aria-pressed="true" aria-label="Son des pages">
        <svg class="on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg>
        <svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button class="btn icon" id="readBtn" type="button" aria-label="Mode lecture plein écran">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <div class="pick">
        <span class="btn primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Importer<span class="lbl-long"> des planches</span></span>
        </span>
        <input id="file" type="file" accept="image/*" multiple aria-label="Importer des planches">
      </div>
    </div>
  </header>

  <p class="note msg" id="msg" role="status" hidden></p>
  <p class="note" id="note">Planches d'exemple. Importe les tiennes pour voir ton livre imprimé, ou glisse-les ici.</p>

  <section class="stage" id="stage" aria-label="Livre">
    <div class="bookwrap" id="bookwrap"><div class="book" id="book"></div></div>
  </section>

  <button class="btn icon exit" id="exitBtn" type="button" aria-label="Quitter le mode lecture">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>

  <nav class="pager" aria-label="Navigation">
    <button class="btn arrow" id="btnL" type="button" aria-label="Page à gauche">&#8249;</button>
    <div class="mid">
      <input id="range" type="range" min="0" max="1" step="1" value="0" aria-label="Position dans le livre">
      <div class="where" id="where" aria-live="polite"></div>
    </div>
    <button class="btn arrow" id="btnR" type="button" aria-label="Page à droite">&#8250;</button>
  </nav>

  <section class="opts" aria-label="Réglages">
    <div class="group">
      <span>Lecture</span>
      <div class="seg" role="group" aria-label="Sens de lecture">
        <button class="btn" id="dirJp" type="button" aria-pressed="true">Japonais &larr;</button>
        <button class="btn" id="dirWest" type="button" aria-pressed="false">Occidental &rarr;</button>
      </div>
    </div>
    <div class="group">
      <span>Couverture</span>
      <button class="btn" id="coverBtn" type="button" aria-pressed="true">1re image = couverture</button>
    </div>
    <div class="group">
      <span>Zoom</span>
      <button class="btn icon" id="zoomOut" type="button" aria-label="Zoom arrière">&minus;</button>
      <span class="zoomval" id="zoomVal">100%</span>
      <button class="btn icon" id="zoomIn" type="button" aria-label="Zoom avant">+</button>
    </div>
  </section>

  <section class="tray sample" id="tray">
    <h2>Planches</h2>
    <ol class="thumbs" id="thumbs"></ol>
  </section>

  <footer class="foot"><b>Inkyo View</b> · Inkyo-Eumène · Pour l'installer : menu du navigateur, puis « Ajouter à l'écran d'accueil ».</footer>
</div>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DUR = reduce ? 60 : 900;
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), wrapEl = $('bookwrap'), book = $('book');
  var rangeEl = $('range'), whereEl = $('where'), btnL = $('btnL'), btnR = $('btnR');
  var zoomLevels = [1, 1.5, 2, 3];

  var state = { imgs: [], rtl: true, cover: true, zoom: 1, flipped: 0, sample: true, sound: true, immersive: false };
  var P = [], L = 0, leaves = [], baseUn, baseFl, staggerTimers = [], zTimers = [], enteredFs = false;

  /* ---------- Storage (IndexedDB, so planches survive a restart) ---------- */
  function idb() {
    return new Promise(function (res, rej) {
      try {
        var r = indexedDB.open('inkyo-view', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      } catch (e) { rej(e); }
    });
  }
  function idbGet(keys) {
    return idb().then(function (db) {
      return Promise.all(keys.map(function (k) {
        return new Promise(function (res) {
          var q = db.transaction('kv', 'readonly').objectStore('kv').get(k);
          q.onsuccess = function () { res(q.result); }; q.onerror = function () { res(undefined); };
        });
      }));
    });
  }
  function idbPut(k, v) { idb().then(function (db) { var s = db.transaction('kv', 'readwrite').objectStore('kv'); if (v === null) s.delete(k); else s.put(v, k); }).catch(function () {}); }

  function saveSettings() {
    clearTimeout(saveT);
    saveT = setTimeout(function () { idbPut('settings', { rtl: state.rtl, cover: state.cover, sound: state.sound, flipped: state.flipped, sample: state.sample }); }, 300);
  }
  function saveImgs() { idbPut('imgs', state.sample ? null : state.imgs); saveSettings(); }

  /* ---------- Example pages (drawn on canvas) ---------- */
  function rng(seed) {

      seed |= 0; seed = seed + 0x6D2B79F5 | 0;

      g.fillStyle = '#2a2a2a';

        for (var xx = x + (row % 2 ? 4 : 0); xx < x + w; xx += 8) {

      g.fillStyle = '#121212'; g.fillRect(x, y, w, h);
      g.fillStyle = '#fdfdfb';
      g.beginPath(); g.arc(x + w * 0.5, y + h * 0.5, Math.min(w, h) * (0.14 + r() * 0.12), 0, 6.2832); g.fill();
      g.strokeStyle = '#fdfdfb'; g.lineWidth = 2;

      g.fillStyle = '#fdfdfb'; g.strokeStyle = '#111'; g.lineWidth = 3;

  function panels(g, r, x, y, w, h, d) {

    }
  }
  function makeSamplePage(i) {

    var g = c.getContext('2d'), r = rng(i * 977 + 13), m = 44;
