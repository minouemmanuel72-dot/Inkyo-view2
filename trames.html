<style>
/* Layout: app bar, tabs (Livre / Trames), preview stage, presets, type + motif, parameters, export bar. Same green tokens as Inkyo View. */
:root {
  --bg: #f1f9f3; --bg2: #ffffff; --ink: #0c2015; --muted: #4f6b5a; --line: #c9e3d1;
  --acc: #5cf593; --acc2: #22c765; --acc-ink: #062712; --acc-text: #0b7a3b; --glow: rgba(52, 214, 110, 0.55);
  --mark1: #46e08a; --mark2: #16b55a; --mark3: #0b8a40; --overlay: rgba(241, 249, 243, 0.84);
  --stage: #dff2e5;
  --f-brand: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body: 'Zen Kaku Gothic New', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #06100a; --bg2: #0f1c14; --ink: #e9f8ee; --muted: #86a894; --line: #1d3626;
    --acc: #7dffa6; --acc2: #2fd16a; --acc-ink: #04210f; --acc-text: #7dffa6; --glow: rgba(125, 255, 166, 0.45);
    --mark1: #d4ffe2; --mark2: #7dffa6; --mark3: #2fd16a; --overlay: rgba(6, 16, 10, 0.8); --stage: #07110b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #06100a; --bg2: #0f1c14; --ink: #e9f8ee; --muted: #86a894; --line: #1d3626;
  --acc: #7dffa6; --acc2: #2fd16a; --acc-ink: #04210f; --acc-text: #7dffa6; --glow: rgba(125, 255, 166, 0.45);
  --mark1: #d4ffe2; --mark2: #7dffa6; --mark3: #2fd16a; --overlay: rgba(6, 16, 10, 0.8); --stage: #07110b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
.wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { font-family: var(--f-brand); font-weight: 800; font-size: 24px; line-height: 0.8; letter-spacing: -0.03em; display: flex; flex-direction: column; background: linear-gradient(135deg, var(--mark1), var(--mark2) 50%, var(--mark3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.32em; color: var(--acc-text); text-transform: uppercase; padding-left: 12px; border-left: 1px solid var(--line); line-height: 1.2; }
.btn { font: 500 14px/1 var(--f-body); min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn:hover:not(:disabled) { border-color: var(--acc2); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: linear-gradient(135deg, var(--acc), var(--acc2)); border-color: transparent; color: var(--acc-ink); font-weight: 700; box-shadow: 0 6px 24px -8px var(--glow); }
.btn.icon { width: 44px; padding: 0; }
.btn[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 700; }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--acc2); outline-offset: 2px; }
#themeBtn svg { display: none; }
#themeBtn[data-mode="auto"] .t-auto, #themeBtn[data-mode="light"] .t-light, #themeBtn[data-mode="dark"] .t-dark { display: block; }

.tabs { display: flex; gap: 6px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg2); }
.tabs a { flex: 1; text-align: center; padding: 10px 8px; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 700; font-family: var(--f-brand); font-size: 14px; }
.tabs a[aria-current="page"] { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: var(--acc-ink); }

.stage { position: relative; display: flex; justify-content: center; align-items: center; border: 1px solid var(--line); border-radius: 18px; background: var(--stage); padding: 12px; overflow: hidden; }
.paper { position: relative; background: #fff; box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.45); line-height: 0; touch-action: pan-y; }
.paper.ink-white { background: #17171b; }
.paper.detail { touch-action: none; cursor: grab; }
.paper canvas { display: block; width: 100%; height: 100%; }
.busy { position: absolute; right: 10px; top: 10px; font: 11px var(--f-mono); color: var(--muted); letter-spacing: 0.1em; }

.row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: nowrap; }
.seg .btn { border-radius: 0; margin-left: -1px; min-height: 40px; padding: 0 14px; }
.seg .btn:first-child { border-radius: 12px 0 0 12px; margin-left: 0; }
.seg .btn:last-child { border-radius: 0 12px 12px 0; }
.seg.full { display: flex; width: 100%; }
.seg.full .btn { flex: 1; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chips .btn { flex: none; min-height: 38px; font-size: 13px; }

.panel { border: 1px solid var(--line); border-radius: 14px; background: var(--bg2); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { margin: 0; font-family: var(--f-brand); font-size: 15px; font-weight: 700; }
.ctrl { display: flex; flex-direction: column; gap: 2px; }
.ctrl .top2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ctrl label { font-size: 14px; }
.ctrl output { font-family: var(--f-mono); font-size: 13px; color: var(--acc-text); font-variant-numeric: tabular-nums; }
.ctrl input[type=range] { width: 100%; accent-color: var(--acc2); margin: 0; min-height: 30px; }
.ctrl .hint2 { font-size: 12px; color: var(--muted); }
.sel { font: 500 15px/1.2 var(--f-body); min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
.exports { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.exports .wide { grid-column: 1 / -1; }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.note.ok { color: var(--acc-text); }
.dice { min-height: 36px; padding: 0 12px; }
@media (max-width: 520px) { .tag { display: none; } .mark { font-size: 21px; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="mark"><span>Ink</span><span>yo</span></div><div class="tag">Trames</div></div>
    <button class="btn icon" id="themeBtn" type="button" data-mode="auto" aria-label="Thème : automatique">
      <svg class="t-auto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" fill="currentColor"/></svg>
      <svg class="t-light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="t-dark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
    </button>
  </header>
  <nav class="tabs" aria-label="Outils"><a href="./">Livre</a><a href="trames.html" aria-current="page">Trames</a><a href="planche.html">Planche</a></nav>

  <div class="stage" id="stage"><div class="paper" id="paper"><canvas id="cv"></canvas></div><div class="busy" id="busy" hidden>calcul…</div></div>

  <div class="row">
    <div class="seg" role="group" aria-label="Vue"><button class="btn" id="vOver" aria-pressed="true" type="button">Ensemble</button><button class="btn" id="vDet" aria-pressed="false" type="button">Détail 1:1</button></div>
    <span class="lbl" id="dim"></span>
  </div>

  <div><div class="lbl" style="margin-bottom:6px">Préréglages</div><div class="chips" id="presets"></div></div>

  <section class="panel">
    <h2>Type de trame</h2>
    <div class="seg full" id="segType" role="group" aria-label="Type"></div>
    <div id="motifBox" style="display:flex;flex-direction:column;gap:14px"><div class="lbl">Motif</div>
    <div class="seg full" id="segMotif" role="group" aria-label="Motif"></div></div>
    <div id="ctrls" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>

  <section class="panel">
    <h2>Mes trames</h2>
    <button class="btn" id="saveMine" type="button">Enregistrer ces réglages</button>
    <div class="chips" id="mine"></div>
    <p class="note" id="mineNote">Tes trames préférées, gardées sur ce téléphone.</p>
  </section>

  <section class="panel">
    <h2>Exporter</h2>
    <div class="ctrl"><div class="top2"><label for="fmt">Format</label></div><select class="sel" id="fmt"></select></div>
    <div class="row"><span class="lbl">Encre</span><div class="seg"><button class="btn" id="inkB" type="button" aria-pressed="true">Noire</button><button class="btn" id="inkW" type="button" aria-pressed="false">Blanche</button></div></div>
    <div class="row"><span class="lbl">Fond</span><div class="seg"><button class="btn" id="bgT" type="button" aria-pressed="true">Transparent</button><button class="btn" id="bgO" type="button" aria-pressed="false">Opaque</button></div></div>
    <div class="exports">
      <button class="btn primary wide" id="dl" type="button">Télécharger le PNG</button>
      <button class="btn" id="share" type="button">Partager</button>
      <button class="btn" id="rnd" type="button">Au hasard</button>
    </div>
    <p class="note" id="msg">PNG transparent : pose-le en calque au-dessus de ton dessin dans ton appli de dessin.</p>
  </section>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- theme (shared with Inkyo View) ---------- */
  var themeMode = 'auto';
  try { var tm = localStorage.getItem('iv-theme'); if (tm === 'light' || tm === 'dark') themeMode = tm; } catch (e) {}
  function applyTheme() {
    var r = document.documentElement; if (themeMode === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', themeMode);
    var b = $('themeBtn'), nm = { auto: 'automatique', light: 'clair', dark: 'sombre' };
    b.setAttribute('data-mode', themeMode); b.setAttribute('aria-label', 'Thème : ' + nm[themeMode]);
    try { var tc = document.querySelector('meta[name="theme-color"]'); tc.setAttribute('content', getComputedStyle(r).getPropertyValue('--bg').trim()); } catch (e) {}
  }
  $('themeBtn').addEventListener('click', function () {
    themeMode = themeMode === 'auto' ? 'light' : (themeMode === 'light' ? 'dark' : 'auto');
    try { if (themeMode === 'auto') localStorage.removeItem('iv-theme'); else localStorage.setItem('iv-theme', themeMode); } catch (e) {}
    applyTheme();
  });
  applyTheme();

  /* ---------- noise ---------- */
  function hash(ix, iy, seed) {
    var h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
    return (h >>> 0) / 4294967295;
  }
  function vnoise(x, y, seed) {
    var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    var a = hash(ix, iy, seed), b = hash(ix + 1, iy, seed), c = hash(ix, iy + 1, seed), d = hash(ix + 1, iy + 1, seed);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  function fbm(x, y, seed) {
    var s = 0, amp = 0.5, f = 1, n = 0;
    for (var o = 0; o < 5; o++) { s += amp * vnoise(x * f, y * f, seed + o * 17); n += amp; amp *= 0.5; f *= 2.03; }
    return s / n;
  }
  function sstep(a, b, x) { var t = (x - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  /* ---------- state ---------- */
  var FORMATS = [
    { id: 'sq2000', n: 'Carré 2000 px', w: 2000, h: 2000 },
    { id: 'sq1200', n: 'Carré 1200 px (léger)', w: 1200, h: 1200 },
    { id: 'a5', n: 'A5 portrait 300 dpi (1748×2480)', w: 1748, h: 2480 },
    { id: 'b5', n: 'B5 portrait 300 dpi (2150×3035)', w: 2150, h: 3035 },
    { id: 'a5l', n: 'A5 paysage 300 dpi (2480×1748)', w: 2480, h: 1748 },
    { id: 'band', n: 'Bandeau 3000×1000', w: 3000, h: 1000 }
  ];
  var DEF = {
    type: 'dots', motif: 'dot', fmt: 'sq2000',
    tone: 50, angle: 45, pitch: 16,
    gKind: 'lin', gAngle: 90, t0: 5, t1: 85, gGamma: 100, gRad: 70,
    top: 80, hor: 4, skyGamma: 130, cloudAmt: 45, cloudSize: 40, cloudSoft: 14, stretch: 250, cloudBias: 40, cloudTone: 0, seed: 7, stars: 0,
    grainGrad: 0, spdKind: 'rad', spdN: 90, spdIn: 22, spdW: 40, spdJit: 60, spdAng: 0,
    inkWhite: false, whiteBg: false
  };
  var S = {};
  (function () { for (var k in DEF) S[k] = DEF[k]; try { var sv = JSON.parse(localStorage.getItem('iv-trames') || 'null'); if (sv) for (var k2 in DEF) if (sv[k2] !== undefined) S[k2] = sv[k2]; } catch (e) {} })();
  function save() { try { localStorage.setItem('iv-trames', JSON.stringify(S)); } catch (e) {} }

  var TYPES = [{ id: 'dots', n: 'Points' }, { id: 'grad', n: 'Dégradé' }, { id: 'sky', n: 'Ciel' }, { id: 'grain', n: 'Grain' }, { id: 'speed', n: 'Vitesse' }];
  var MOTIFS = [{ id: 'dot', n: 'Points' }, { id: 'line', n: 'Lignes' }, { id: 'cross', n: 'Croisé' }, { id: 'sq', n: 'Carrés' }];

  /* controls: key, label, min, max, step, unit, show(S) */
  var CTRL = [
    { k: 'tone', l: 'Densité (encre)', min: 2, max: 100, u: '%', show: function (s) { return s.type === 'dots' || s.type === 'grain'; } },
    { k: 'grainGrad', l: 'Dégradé du haut vers le bas', min: 0, max: 100, u: '%', h: '0 = grain régulier. 100 = le grain disparaît en bas.', show: function (s) { return s.type === 'grain'; } },
    { k: 'pitch', l: 'Finesse : écart entre points', min: 4, max: 60, u: ' px', h: 'Plus petit = trame plus fine.', show: function (s) { return s.type !== 'speed'; } },
    { k: 'angle', l: 'Angle de la trame', min: 0, max: 90, u: '°', show: function (s) { return s.type !== 'speed' && s.type !== 'grain'; } },
    { k: 'spdKind', seg: [['rad', 'Concentration'], ['par', 'Parallèles']], l: 'Lignes de vitesse', show: function (s) { return s.type === 'speed'; } },
    { k: 'spdN', l: 'Nombre de lignes', min: 10, max: 300, u: '', show: function (s) { return s.type === 'speed'; } },
    { k: 'spdIn', l: 'Zone libre au centre', min: 0, max: 80, u: '%', show: function (s) { return s.type === 'speed'; } },
    { k: 'spdW', l: 'Épaisseur des lignes', min: 5, max: 100, u: '%', show: function (s) { return s.type === 'speed'; } },
    { k: 'spdJit', l: 'Irrégularité', min: 0, max: 100, u: '%', show: function (s) { return s.type === 'speed'; } },
    { k: 'spdAng', l: 'Direction (0° = horizontal)', min: 0, max: 179, u: '°', show: function (s) { return s.type === 'speed' && s.spdKind === 'par'; } },
    { k: 'gKind', seg: [['lin', 'Linéaire'], ['rad', 'Radial']], l: 'Forme du dégradé', show: function (s) { return s.type === 'grad'; } },
    { k: 'gAngle', l: 'Direction (90° = vers le bas)', min: 0, max: 359, u: '°', show: function (s) { return s.type === 'grad' && s.gKind === 'lin'; } },
    { k: 'gRad', l: 'Rayon', min: 20, max: 150, u: '%', show: function (s) { return s.type === 'grad' && s.gKind === 'rad'; } },
    { k: 't0', l: 'Densité au départ', min: 0, max: 100, u: '%', show: function (s) { return s.type === 'grad'; } },
    { k: 't1', l: 'Densité à l\'arrivée', min: 0, max: 100, u: '%', show: function (s) { return s.type === 'grad'; } },
    { k: 'gGamma', l: 'Courbe du dégradé', min: 30, max: 300, u: '', h: '100 = régulier. Plus haut : le noir reste longtemps léger.', show: function (s) { return s.type === 'grad'; } },
    { k: 'top', l: 'Haut du ciel', min: 0, max: 100, u: '%', show: function (s) { return s.type === 'sky'; } },
    { k: 'hor', l: 'Horizon', min: 0, max: 100, u: '%', show: function (s) { return s.type === 'sky'; } },
    { k: 'skyGamma', l: 'Courbe du ciel', min: 40, max: 300, u: '', show: function (s) { return s.type === 'sky'; } },
    { k: 'cloudAmt', l: 'Quantité de nuages', min: 0, max: 100, u: '%', show: function (s) { return s.type === 'sky'; } },
    { k: 'cloudSize', l: 'Taille des nuages', min: 0, max: 100, u: '%', show: function (s) { return s.type === 'sky' && s.cloudAmt > 0; } },
    { k: 'cloudSoft', l: 'Douceur des bords', min: 1, max: 100, u: '%', show: function (s) { return s.type === 'sky' && s.cloudAmt > 0; } },
    { k: 'stretch', l: 'Étirement horizontal', min: 100, max: 800, u: '%', show: function (s) { return s.type === 'sky' && s.cloudAmt > 0; } },
    { k: 'cloudBias', l: 'Nuages vers l\'horizon', min: 0, max: 100, u: '%', show: function (s) { return s.type === 'sky' && s.cloudAmt > 0; } },
    { k: 'cloudTone', l: 'Densité dans les nuages', min: 0, max: 60, u: '%', h: '0 = nuages blancs.', show: function (s) { return s.type === 'sky' && s.cloudAmt > 0; } },
    { k: 'stars', l: 'Étoiles', min: 0, max: 100, u: '%', show: function (s) { return s.type === 'sky'; } },
    { k: 'seed', l: 'Forme des nuages (graine)', min: 1, max: 200, u: '', dice: true, show: function (s) { return s.type === 'sky' || s.type === 'speed' || s.type === 'grain'; } }
  ];

  /* ---------- tone fields ---------- */
  function makeTone(W, H) {
    var f;
    if (S.type === 'dots') { var t = S.tone / 100; f = function () { return t; }; f.c = true; return f; }
    if (S.type === 'grain') { var gt = S.tone / 100, gg = S.grainGrad / 100; f = function (x, y) { return gt * (1 - gg * clamp01(y / H)); }; if (gg === 0) f.c = true; return f; }
    if (S.type === 'speed') return function () { return 1; };
    if (S.type === 'grad') {
      var t0 = S.t0 / 100, t1 = S.t1 / 100, g = S.gGamma / 100, cx = W / 2, cy = H / 2;
      if (S.gKind === 'lin') {
        var a = S.gAngle * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), L = Math.abs(W * ca) + Math.abs(H * sa) || 1;
        return function (x, y) { var u = clamp01(((x - cx) * ca + (y - cy) * sa) / L + 0.5); return t0 + (t1 - t0) * Math.pow(u, g); };
      }
      var R = Math.hypot(W, H) / 2 * S.gRad / 100 || 1;
      return function (x, y) { var u = clamp01(Math.hypot(x - cx, y - cy) / R); return t0 + (t1 - t0) * Math.pow(u, g); };
    }
    var top = S.top / 100, hor = S.hor / 100, sg = S.skyGamma / 100, amt = S.cloudAmt / 100, soft = 0.01 + S.cloudSoft / 100 * 0.24;
    var sc = W * (0.04 + 0.5 * S.cloudSize / 100), sx = sc * S.stretch / 100, sy = sc, bias = S.cloudBias / 100, ct = S.cloudTone / 100, seed = S.seed | 0;
    return function (x, y) {
      var yn = clamp01(y / H), base = top + (hor - top) * Math.pow(yn, sg);
